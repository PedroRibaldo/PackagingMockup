<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" id="themeColor" content="#0A3A20">
<title>Unlock your offer</title>
<script>

// CONFIGURATION

const BRAND = {
  name: "Cachaça 51",
  badgeColor: "#E30613"
};

// FLAVORS: each visitor gets one of these at random, with equal chance
// To force one (for testing or the backup recording), add ?flavor=lime or ?flavor=strawberry to the address
const FLAVORS = [
  {
    fruit: "lime",
    tagline: "Lime Caipirinha · Ready to drink",
    primaryColor: "#C8F03C",    // buttons, discount, fruit, highlights
    secondaryColor: "#F5C443",  // labels, code border, confetti drops
    backgroundColor: "#0A3A20", // page background
    textColor: "#FFF9E6"        // main text
  },
  {
    fruit: "strawberry",
    tagline: "Strawberry Caipirinha · Ready to drink",
    primaryColor: "#FF6F8B",    // buttons, discount, fruit, highlights
    secondaryColor: "#8EE07A",  // labels, code border, confetti drops
    backgroundColor: "#3D0A1A", // page background
    textColor: "#FFF4F2"        // main text
  }
];

// OFFERS: one entry per Product Key
const OFFERS = [
  {
    key: "FEST10",
    eventType: "Festival",
    eventName: "YOUR FESTIVAL EVENT NAME",
    discount: "10% off",
    code: "DEMO-FEST-7Q2K",
    eventUrl: "https://www.sympla.com.br/evento/carvalheira-na-ladeira-2027/3314458?share_id=copiarlink"
  },
  {
    key: "SPORT05",
    eventType: "Sports",
    eventName: "YOUR SPORTS EVENT NAME",
    discount: "5% off",
    code: "DEMO-SPORT-4M8X",
    eventUrl: "https://www.sympla.com.br/evento/run-t-wellness-experience/3570428?share_id=copiarlink"
  },
  {
    key: "FOOD15",
    eventType: "Food & Culture",
    eventName: "YOUR FOOD OR CULTURE EVENT NAME",
    discount: "15% off",
    code: "DEMO-FOOD-9T3P",
    eventUrl: "https://bileto.sympla.com.br/event/125996?share_id=1-copiarlink"
  }
];
</script>
<script>
// Pick black or white text, whichever reads better on a given color
function readableOn(hex) {
  var h = String(hex).replace("#", "");
  if (h.length === 3) h = h.replace(/./g, "$&$&");
  var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? "#000000" : "#FFFFFF";
}

var FLAVOR = (function () {
  var forced = (location.search.match(/[?&]flavor=([a-z]+)/i) || [])[1];
  var pick = null;
  for (var i = 0; i < FLAVORS.length; i++) {
    if (forced && FLAVORS[i].fruit === forced.toLowerCase()) pick = FLAVORS[i];
  }
  if (!pick) pick = FLAVORS[Math.floor(Math.random() * FLAVORS.length)];

  var root = document.documentElement;
  root.setAttribute("data-fruit", pick.fruit);
  root.style.setProperty("--primary", pick.primaryColor);
  root.style.setProperty("--secondary", pick.secondaryColor);
  root.style.setProperty("--bg", pick.backgroundColor);
  root.style.setProperty("--text", pick.textColor);
  root.style.setProperty("--on-primary", readableOn(pick.primaryColor));
  if (BRAND.badgeColor) {
    root.style.setProperty("--badge", BRAND.badgeColor);
    root.style.setProperty("--on-badge", readableOn(BRAND.badgeColor));
  }
  return pick;
})();
</script>
<style>
  :root {
    --primary: #C8F03C;
    --secondary: #F5C443;
    --bg: #0A3A20;
    --text: #FFF9E6;
    --on-primary: #000000;
    --badge: #E30613;
    --on-badge: #FFFFFF;
    --pith: #F4FBD9;

    /* Tints derived from the brand colors (solid fallbacks first) */
    --surface: rgba(255, 255, 255, 0.07);
    --surface: color-mix(in srgb, var(--text) 8%, transparent);
    --line: rgba(255, 255, 255, 0.2);
    --line: color-mix(in srgb, var(--text) 22%, transparent);
    --field: rgba(0, 0, 0, 0.25);
    --field: color-mix(in srgb, var(--bg) 65%, #000);
    --glow: rgba(200, 240, 60, 0.45);
    --glow: color-mix(in srgb, var(--primary) 45%, transparent);
    --peel: #4F8A1C;
    --peel: color-mix(in srgb, var(--primary) 55%, #0B2A10);

    --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  button, a, input { touch-action: manipulation; }
  .btn:focus-visible, .again:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  [tabindex="-1"]:focus { outline: none; }

  /* Backdrop: glow, lime slices, rising bubbles */
  .backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .backdrop::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(110% 55% at 50% -8%, color-mix(in srgb, var(--primary) 30%, transparent), transparent 65%),
      radial-gradient(90% 45% at 100% 105%, color-mix(in srgb, var(--secondary) 22%, transparent), transparent 65%);
  }
  .slice { position: absolute; display: block; }
  .slice.tr { width: 230px; height: 230px; top: -80px; right: -90px; opacity: 0.16; transform: rotate(18deg); }
  .slice.bl { width: 290px; height: 290px; bottom: -120px; left: -120px; opacity: 0.12; transform: rotate(-12deg); }

  .bubble {
    position: absolute;
    bottom: -40px;
    border-radius: 50%;
    border: 1.5px solid color-mix(in srgb, var(--text) 35%, transparent);
    background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--text) 30%, transparent), transparent 60%);
    animation: float-up var(--dur) linear var(--delay) infinite;
    will-change: transform;
  }
  .bubble.ice { border-radius: 22%; }
  @keyframes float-up {
    from { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    to { transform: translate3d(var(--drift), -115vh, 0) rotate(var(--rot)); opacity: 0.6; }
  }

  /* Layout */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    padding: calc(28px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    text-align: center;
  }

  header { margin: 0 0 28px; }
  .hero {
    width: 104px;
    height: 104px;
    margin: 0 auto 18px;
    border-radius: 50%;
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--primary) 12%, transparent), 0 12px 48px var(--glow);
  }
  .hero svg { display: block; width: 100%; height: 100%; animation: spin 40s linear infinite; }
  .hero.burst { animation: burst 0.8s var(--ease-out); }
  @keyframes spin { to { transform: rotate(360deg); } }
  html[data-fruit="strawberry"] { --peel: color-mix(in srgb, var(--primary) 55%, #4A0012); }
  html[data-fruit="strawberry"] .hero svg { animation: sway 3.2s ease-in-out infinite alternate; transform-origin: 50% 45%; }
  @keyframes sway { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }

  /* Show only the drawing of the chosen flavors fruit */
  html[data-fruit="lime"] .f-strawberry, html[data-fruit="strawberry"] .f-lime { display: none; }
  @keyframes burst {
    0% { transform: scale(1); }
    35% { transform: scale(1.22) rotate(-25deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .brand {
    display: inline-block;
    margin: 0;
    padding: 9px 22px;
    border-radius: 999px;
    background: var(--badge);
    color: var(--on-badge);
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    box-shadow: 0 0 0 3px var(--text), 0 10px 28px -8px var(--badge), inset 0 -2px 0 rgba(0, 0, 0, 0.2);
  }
  .tagline {
    margin: 10px 0 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-wrap: balance;
    color: var(--secondary);
  }

  h1 {
    font-size: 38px;
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    margin: 0 0 20px;
    text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--primary); }

  .card {
    padding: 20px;
    border-radius: 24px;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .lead { display: block; font-size: 17px; line-height: 1.45; opacity: 0.85; margin: 0 0 14px; }

  input {
    width: 100%;
    font: inherit;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-align: center;
    text-transform: uppercase;
    padding: 16px;
    border: 2px solid var(--line);
    border-radius: 16px;
    background: var(--field);
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input::placeholder { color: var(--text); opacity: 0.4; letter-spacing: 0.1em; }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--glow); }
  input.shake { animation: shake 0.4s; }
  @keyframes shake {
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  .error {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 14px 0 0;
    padding: 12px 14px;
    border-radius: 14px;
    border: 2px solid var(--secondary);
    font-size: 16px;
    line-height: 1.4;
    text-align: left;
  }
  .error svg { width: 22px; height: 22px; flex: none; color: var(--secondary); }

  .btn {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 58px;
    margin-top: 14px;
    padding: 0 16px;
    border: 0;
    border-radius: 16px;
    background: var(--primary);
    color: var(--on-primary);
    font: inherit;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 12px 30px -12px var(--glow), inset 0 -3px 0 rgba(0, 0, 0, 0.18);
    transition: transform 0.12s, filter 0.2s;
  }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn:active { transform: scale(0.97); }
  @media (hover: hover) { .btn:hover { filter: brightness(1.08); } }
  .btn.shine::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -60%;
    width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
    transform: skewX(-20deg);
    animation: shine 3.2s ease-in-out 1s infinite;
  }
  @keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  .btn.outline {
    background: transparent;
    color: var(--primary);
    border: 2px solid var(--primary);
    box-shadow: none;
  }
  .btn[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }

  /* Reveal */
  .unlocked {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--primary);
    margin: 0 0 16px;
  }
  .unlocked svg { width: 22px; height: 22px; flex: none; }
  .event-type {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--secondary);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--secondary);
    margin-bottom: 12px;
  }
  .event-name { font-size: 26px; font-weight: 800; line-height: 1.15; margin: 0 0 8px; text-wrap: balance; }
  .discount {
    font-size: 76px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--primary);
    text-shadow: 0 0 36px var(--glow);
    margin: 0 0 24px;
  }
  .code-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.8;
    margin: 0 0 8px;
  }
  .code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 18px 12px;
    border: 2px dashed var(--secondary);
    border-radius: 16px;
    background: var(--surface);
    word-break: break-all;
    -webkit-user-select: all;
    user-select: all;
  }
  .again {
    margin-top: 22px;
    align-self: center;
    background: none;
    border: 0;
    color: var(--text);
    opacity: 0.7;
    font: inherit;
    font-size: 15px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    min-height: 44px;
    padding: 10px 16px;
  }
  .again:active { opacity: 0.4; }

  /* Entrance: each block rises in, slightly staggered */
  header, #entry > *, #reveal > * { animation: rise 0.5s var(--ease-out) backwards; }
  #entry > :nth-child(1), #reveal > :nth-child(1) { animation-delay: 0.05s; }
  #entry > :nth-child(2), #reveal > :nth-child(2) { animation-delay: 0.1s; }
  #reveal > :nth-child(3) { animation-delay: 0.15s; }
  #reveal > :nth-child(4) { animation-delay: 0.2s; }
  #reveal > :nth-child(5) { animation-delay: 0.25s; }
  #reveal > :nth-child(6) { animation-delay: 0.28s; }
  #reveal > :nth-child(7) { animation-delay: 0.32s; }
  #reveal > :nth-child(8) { animation-delay: 0.36s; }
  #reveal > :nth-child(9) { animation-delay: 0.4s; }
  #reveal { display: flex; flex-direction: column; }
  #reveal > .event-type { align-self: center; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .bubble { display: none; }
  }
</style>
</head>
<body>
<!-- Fruit drawings, reused in the header and the background -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="lime" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="58" style="fill:var(--peel)"/>
    <circle cx="60" cy="60" r="52" style="fill:var(--pith)"/>
    <circle cx="60" cy="60" r="47" style="fill:var(--primary)"/>
    <path d="M13 60H107M60 13V107M26.8 26.8L93.2 93.2M93.2 26.8L26.8 93.2" style="stroke:var(--pith);stroke-width:3.5;stroke-linecap:round"/>
    <ellipse cx="44" cy="40" rx="14" ry="8" transform="rotate(-35 44 40)" style="fill:#fff;opacity:.35"/>
    <circle cx="60" cy="60" r="6" style="fill:var(--pith)"/>
  </symbol>
  <symbol id="strawberry" viewBox="0 0 120 120">
    <path d="M60 113C31 101 12 74 14 52C16 36 32 29 60 35C88 29 104 36 106 52C108 74 89 101 60 113Z" style="fill:var(--primary);stroke:var(--peel);stroke-width:3"/>
    <ellipse cx="40" cy="52" rx="13" ry="7" transform="rotate(-30 40 52)" style="fill:#fff;opacity:.3"/>
    <g style="fill:#FFE9A8">
      <ellipse cx="60" cy="52" rx="1.8" ry="3"/><ellipse cx="80" cy="54" rx="1.8" ry="3"/>
      <ellipse cx="32" cy="67" rx="1.8" ry="3"/><ellipse cx="50" cy="67" rx="1.8" ry="3"/>
      <ellipse cx="70" cy="67" rx="1.8" ry="3"/><ellipse cx="88" cy="67" rx="1.8" ry="3"/>
      <ellipse cx="42" cy="81" rx="1.8" ry="3"/><ellipse cx="60" cy="83" rx="1.8" ry="3"/>
      <ellipse cx="78" cy="81" rx="1.8" ry="3"/><ellipse cx="51" cy="96" rx="1.8" ry="3"/>
      <ellipse cx="69" cy="96" rx="1.8" ry="3"/><ellipse cx="60" cy="106" rx="1.6" ry="2.6"/>
    </g>
    <path d="M60 39L42 24L53 36L30 31L48 42L60 40L72 42L90 31L67 36L78 24Z" style="fill:var(--secondary);stroke:var(--secondary);stroke-width:3;stroke-linejoin:round"/>
    <path d="M60 38V15" style="stroke:var(--secondary);stroke-width:5;stroke-linecap:round"/>
  </symbol>
</svg>

<div class="backdrop" id="backdrop" aria-hidden="true">
  <svg class="slice tr"><use class="f-lime" href="#lime"/><use class="f-strawberry" href="#strawberry"/></svg>
  <svg class="slice bl"><use class="f-lime" href="#lime"/><use class="f-strawberry" href="#strawberry"/></svg>
</div>

<canvas id="confetti"></canvas>

<main>
  <header>
    <div class="hero" id="hero" aria-hidden="true"><svg><use class="f-lime" href="#lime"/><use class="f-strawberry" href="#strawberry"/></svg></div>
    <p class="brand" id="brand"></p>
    <p class="tagline" id="tagline"></p>
  </header>

  <!-- State 1 key entry -->
  <section id="entry">
    <h1>Found something <em>under the cap?</em></h1>
    <form class="card" id="form" novalidate>
      <label class="lead" for="key">Enter your Product Key.</label>
      <input id="key" type="text" maxlength="30" placeholder="YOUR KEY"
             autocomplete="off" autocapitalize="characters" autocorrect="off"
             spellcheck="false" enterkeyhint="go" aria-describedby="error">
      <p class="error" id="error" role="alert" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>
        <span>That key doesn't look right, check the cap again.</span>
      </p>
      <button class="btn shine" type="submit">Unlock</button>
    </form>
  </section>

  <!-- State 2 reveal -->
  <section id="reveal" hidden>
    <p class="unlocked">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
      Unlocked!
    </p>
    <span class="event-type" id="eventType"></span>
    <h2 class="event-name" id="eventName" tabindex="-1"></h2>
    <p class="discount" id="discount"></p>
    <p class="code-label">Your discount code</p>
    <div class="code" id="code"></div>
    <button class="btn outline" id="copy" type="button">Copy code</button>
    <a class="btn" id="eventLink" target="_blank" rel="noopener">See the event</a>
    <button class="again" id="again" type="button">Enter another key</button>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var reducedMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function normalize(value) {
    return String(value).toUpperCase().replace(/[\s-]+/g, "");
  }

  // Show the brand and this visitors flavor
  $("brand").textContent = BRAND.name;
  $("tagline").textContent = FLAVOR.tagline || "";
  $("tagline").hidden = !FLAVOR.tagline;
  document.title = BRAND.name;
  $("themeColor").setAttribute("content", FLAVOR.backgroundColor);

  // Rising bubbles and ice cubes in the background
  if (!reducedMotion) {
    var backdrop = $("backdrop");
    for (var b = 0; b < 12; b++) {
      var s = document.createElement("span");
      var size = 8 + Math.random() * 22;
      s.className = b % 4 === 0 ? "bubble ice" : "bubble";
      s.style.cssText =
        "left:" + (Math.random() * 100) + "%;" +
        "width:" + size + "px;height:" + size + "px;" +
        "--dur:" + (9 + Math.random() * 9) + "s;" +
        "--delay:" + (-Math.random() * 18) + "s;" +
        "--drift:" + ((Math.random() - 0.5) * 80) + "px;" +
        "--rot:" + (b % 4 === 0 ? 180 : 0) + "deg";
      backdrop.appendChild(s);
    }
  }

  var input = $("key"), error = $("error"), copyBtn = $("copy"), link = $("eventLink");

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var typed = normalize(input.value);
    var offer = null;
    for (var i = 0; i < OFFERS.length; i++) {
      if (normalize(OFFERS[i].key) === typed) { offer = OFFERS[i]; break; }
    }
    if (offer) showReveal(offer); else showError();
  });

  input.addEventListener("input", function () {
    error.hidden = true;
    input.removeAttribute("aria-invalid");
  });

  function showError() {
    error.hidden = false;
    input.setAttribute("aria-invalid", "true");
    input.classList.remove("shake");
    void input.offsetWidth; // restart the shake animation
    input.classList.add("shake");
    input.focus();
    input.select();
  }

  function showReveal(offer) {
    $("eventType").textContent = offer.eventType;
    $("eventName").textContent = offer.eventName;
    $("code").textContent = offer.code;
    copyBtn.textContent = "Copy code";

    if (/^https?:\/\//i.test(offer.eventUrl)) {
      link.href = offer.eventUrl;
      link.removeAttribute("aria-disabled");
      link.textContent = "See the event";
    } else {
      link.removeAttribute("href");
      link.setAttribute("aria-disabled", "true");
      link.textContent = "Event link not set yet";
    }

    input.blur();
    $("entry").hidden = true;
    $("reveal").hidden = false;
    window.scrollTo(0, 0);
    $("eventName").focus({ preventScroll: true });

    var hero = $("hero");
    hero.classList.remove("burst");
    void hero.offsetWidth; // restart the burst animation
    hero.classList.add("burst");

    countUp($("discount"), offer.discount);
    confetti();
  }

  // Count the first number in the discount up from zero
  var countRun = 0;
  function countUp(el, text) {
    var match = String(text).match(/\d+/);
    var run = ++countRun;
    if (!match || reducedMotion) { el.textContent = text; return; }
    var target = parseInt(match[0], 10), start = null, duration = 900;
    el.textContent = text.replace(match[0], "0");
    function step(now) {
      if (run !== countRun) return;
      if (start === null) start = now;
      var p = Math.min(1, (now - start) / duration);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = text.replace(match[0], String(Math.round(target * eased)));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  $("again").addEventListener("click", function () {
    $("reveal").hidden = true;
    $("entry").hidden = false;
    error.hidden = true;
    input.removeAttribute("aria-invalid");
    input.value = "";
    input.focus();
  });

  // Copy, with a fallback for in-app QR browsers that block the clipboard
  copyBtn.addEventListener("click", function () {
    var codeEl = $("code"), text = codeEl.textContent;
    function done() {
      copyBtn.textContent = "Copied!";
      setTimeout(function () { copyBtn.textContent = "Copy code"; }, 2000);
    }
    function fallback() {
      var range = document.createRange();
      range.selectNodeContents(codeEl);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      try { if (document.execCommand("copy")) { done(); return; } } catch (err) {}
      copyBtn.textContent = "Press and hold the code to copy";
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  });

  // Short burst of fruit pieces, sugar crystals and colored drops
  function confetti() {
    if (reducedMotion) return;
    var canvas = $("confetti"), ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1, W = window.innerWidth, H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var pith = "#F4FBD9";
    var parts = [];
    for (var i = 0; i < 150; i++) {
      parts.push({
        x: W / 2 + (Math.random() - 0.5) * W * 0.3,
        y: H * 0.3,
        vx: (Math.random() - 0.5) * 14,
        vy: -4 - Math.random() * 14,
        s: 5 + Math.random() * 7,
        r: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.3,
        kind: i % 3 // 0 fruit piece, 1 sugar crystal, 2 colored drop
      });
    }

    var start = performance.now();
    function frame(now) {
      var elapsed = now - start;
      var alpha = elapsed > 2500 ? Math.max(0, 1 - (elapsed - 2500) / 700) : 1;
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.vy = Math.min(p.vy + 0.3, 6);
        p.vx *= 0.99;
        p.x += p.vx;
        p.y += p.vy;
        p.r += p.vr;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        if (p.kind === 0 && FLAVOR.fruit === "strawberry") {
          var s = p.s;
          ctx.beginPath();
          ctx.moveTo(0, s * 1.1);
          ctx.bezierCurveTo(-s * 1.2, s * 0.2, -s, -s, 0, -s * 0.7);
          ctx.bezierCurveTo(s, -s, s * 1.2, s * 0.2, 0, s * 1.1);
          ctx.fillStyle = FLAVOR.primaryColor;
          ctx.fill();
          ctx.fillStyle = FLAVOR.secondaryColor;
          ctx.fillRect(-s * 0.55, -s * 0.95, s * 1.1, s * 0.35);
        } else if (p.kind === 0) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, p.s + 3, 0, Math.PI);
          ctx.closePath();
          ctx.fillStyle = FLAVOR.primaryColor;
          ctx.fill();
          ctx.strokeStyle = pith;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        } else if (p.kind === 1) {
          ctx.fillStyle = pith;
          ctx.fillRect(-p.s / 3, -p.s / 3, p.s / 1.5, p.s / 1.5);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.s / 2.2, 0, Math.PI * 2);
          ctx.fillStyle = i % 2 && BRAND.badgeColor ? BRAND.badgeColor : FLAVOR.secondaryColor;
          ctx.fill();
        }
        ctx.restore();
      }
      if (elapsed < 3200) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
